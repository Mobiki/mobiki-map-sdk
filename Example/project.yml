name: MobikiExample
options:
  bundleIdPrefix: uk.mobiki
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15"

packages:
  MobikiSDK:
    path: ../

targets:
  MobikiExample:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - MobikiExample
    dependencies:
      - package: MobikiSDK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.mobiki.example
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: MobikiExample/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: MobikiExample/Info.plist
